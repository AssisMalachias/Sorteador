<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projector Sorteador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENEREÇO_DO_CSS"/>
</head>
<body>
    <main>
        <section class="estrucao">
            <div class="container">
                <h1 class="tituloprimeiro">Sorteador</h1>
                <form action="#" id="formulario-sorteador">
                    <label for="nomeNumero">Número máxima</label>
                    <input type="number" nome="nomeNumero" id="numero-maximo" required min="2" value="2" step="1">
                    <button type="submit">Sortear número</button>
                </form>
               

                <div class="numero-sorteado">
                    <p class="resposta">O número sorteado foi: <span id="resposta-valor"></span></p>
                </div>
            </div><!-- container -->

        </section><!-- estrucao -->
    </main>
    <script src="@@ENEREÇO_DO_JS"></script>
</body>
</html>
